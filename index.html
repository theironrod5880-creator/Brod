<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="AROD — Unified Mastercore" />
    <title>AROD</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0b1020;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #a1a1aa;
        --primary: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0b1020, #111827);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(90vw, 760px);
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        background: rgba(17, 24, 39, 0.9);
        box-shadow: 0 24px 50px rgba(2, 6, 23, 0.4);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        color: var(--muted);
        line-height: 1.65;
        margin: 0 0 1rem;
      }
      .badge {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.15);
        color: #f9d38c;
        border: 1px solid rgba(245, 158, 11, 0.4);
        font-size: 0.8rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">AROD / Unified Mastercore</div>
      <h1>AROD</h1>
      <p>
        AROD is a web app shell for the Unified Mastercore, with installable PWA support,
        offline caching, and a themed user experience.
      </p>
      <p>
        This page is the app entry point. The service worker will cache the app and make it
        available offline after the first load.
      </p>
    </main>

    <script src="./sw-register.js"></script>
  </body>
</html>
